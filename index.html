<!doctype html>
<html lang="en">
	<!-- heading -->
	<head>
		<title>GlitchHub | A gamer's hub for all things internet</title>
		<link rel="canonical" href="https://pongonpolygon.github.io/pages/glitchhub" />
		<meta name="description" content="The best site for playing games, and watching movies and shows, all in your browser." />
		<meta name="robots" content="index, follow">
		<link rel="icon" type="image/x-icon" href="favicon.ico" />

		<!-- some embed bullcrap i think idk -->
		<meta property="og:title" content="GlitchHub" />
		<meta
			property="og:description"
			content="The best site for free games, movies, and shows." />
		<meta property="og:url" content="https://pongonpolygon.github.io/pages/glitchhub" />
		<meta property="og:type" content="website" />

		<!-- then to make the website ✨ smexy ✨ -->
		<style>
			@import url("https://fonts.googleapis.com/css?family=Press+Start+2P");
			html {
				font-size: 22px;
				user-select: none;
				-webkit-user-select: none;
				-moz-user-select: none;
				-ms-user-select: none;
			}
			body {
				background-color: #000014;
				color: #ffffff;
				font-family: "Press Start 2P";
				margin: 0;
			}
			.heading {
				position: relative;
				top: 0px;
				left: 0px;
				width: 100%;
				height: 125px;
				display: flex;
				align-items: center;
				flex-direction: column;
				justify-content: center;
				z-index: 99;
				font-size: 30px;
			}
			.noscript {
				font-family: "Sans-serif";
				position: fixed;
				align-items: center;
				text-align: center;
				justify-content: center;
				z-index: 1000;
				display: flex;
				width: 100%;
				height: 100%;
				background-color: black;
			}
			a:link {
				color: #66c0ff;
				background-color: transparent;
				text-decoration: none;
			}
			a:visited {
				color: #e875ff;
				background-color: transparent;
				text-decoration: none;
			}
			a:hover {
				color: #bde4ff;
				background-color: transparent;
			}
			.main,
			.body {
				z-index: 999;
				text-align: center;
				padding-top: 60px;
				padding-bottom: 50px;
				overflow-x: hidden;
				word-wrap: break-word;
				overflow-wrap: anywhere;
				margin-top: -80px;
			}
			.mintext {
				text-align: center;
				font-size: 17px;
				background-color: transparent;
				color: #777777;
			}
			.clean-line {
				width: 80%;
				height: 3px;
				margin: 25px auto;
				background: linear-gradient(90deg, transparent, #888, transparent);
			}
			.section {
				display: none;
			}
			.active {
				display: block;
			}
			.active-button {
				background-color: #404070;
				cursor: pointer;
			}
			.button:hover {
				cursor: pointer;
			}
			.inner {
				margin-top: 0px;
				padding: 0;
			}
			.search {
				font-family: "Press Start 2P";
				color: #ffffff;
				background-color: #000024;
				height: 25px;
				border-style: solid;
				border-color: #676777;
				border-radius: 0px;
			}
			.checkbox {
				font-size: 12px;
				color: #777777;
				accent-color: #505095;
			}
		</style>
	</head>

	<body id="body" style="background-image: url('background.png'); background-size: 50%;">
		<!-- for ppl without javascript -->
		<noscript>
			<div class="noscript">
				Sorry, but you either don't have JavaScript support, or it's not on!<br>
				Please turn on JavaScript to use this page.
			</div>
		</noscript>
		
		<div id="loading" class="noscript" style="background-color: transparent; font-family: 'Press Start 2P';">
			<h1>Loading...</h1>
		</div>
		
		<div id="main" style="display: none;">
			<!-- title -->
			<div id="title" class="heading" style="top: -20px;">
				<h1><span style="color: #ffffff">Glitch</span><span style="color: #00ff9c;">Hub</span></h1>
				<p id="description" class="mintext" style="margin-top: -30px;">null</p>
			</div>
			
			<div class="body">
				<!-- page buttons -->
				<h2 id="button-body">
					<span id="playButton" class="button">Play</span>
					<span id="watchButton" class="button">Watch</span>
					<span id="helpButton" class="button">Help</span>
				</h2>
				
				<!-- main items -->
				<div class="inner">
					<div class="clean-line" style="margin-top: -10px;"></div>
					<!-- search bar -->
					<div style="margin-top: -10px;"><input type="text" id="searchBar" placeholder="Search..." class="search"></div>
					
					<!-- play -->
					<div id="playSection" class="main section" style="margin-top: -45px;"> <!-- set active to section when finished with layout -->
						<p id="playCount" class="mintext" style="margin-top: -1px">Games (#)</p>
						
						<div id="play" style="line-height: 1.5; margin-top: -10px;">
							<!-- where games will go -->
						</div>
						
						<div class="mintext" style="margin-top: -10px;">
							<p>(Thats all!)</p>
						</div>
					</div>
					
					<!-- watch -->
					<div id="watchSection" class="main section" style="margin-top: -45px;">
						<p id="watchCount" class="mintext" style="margin-top: -1px;">Movies & Shows (#)</p>
						
						<div id="watch" style="line-height: 1.5; margin-top: -10px;">
							<!-- where movies and shows will go -->
						</div>
						
						<div class="mintext" style="margin-top: -10px;">
							<p>(Thats all!)</p>
						</div>
					</div>
					
					<!-- help section -->
					<div id="helpSection" class="main section" style="margin-top: -45px;">
						<div style="margin-top: -45px; font-size: 12px;" class="mintext">
							<p>Thanks for helping me expand GlitcHub! Also, please don't be a troll.</p>
						</div>
						<!-- forms -->
						<div style="margin-top: -10px;">
							<iframe title="recommendform" src="https://docs.google.com/forms/d/e/1FAIpQLSe2bkjyClt60SSBiMTeRH3ydn_qzQ-w7plRLmrUaW_VaA-Dyg/viewform?embedded=true" width="640" height="1010" style="border: none;" margin-height="0" margin-width="0">Loading…</iframe>
							<br>
							<iframe title="complaintform" src="https://docs.google.com/forms/d/e/1FAIpQLSfXgr2QU1L2I3n6PCFVr231lgiEqL9baA_RFFpleapwdFihRQ/viewform?embedded=true" width="640" height="875" style="border: none;" margin-height="0" margin-width="0">Loading…</iframe>
						</div>
					</div>
					
					<div class="mintext" style="font-size: 16px; margin-top: -75px;">
						<div class="clean-line"></div>
						<!-- pages -->
						<span>
							<a href="https://pongonpolygon.github.io">Home Page</a>
							<a href="https://github.com/PongonPolygon/glitchhub">Source Code</a>
						</span>
						<!-- filter -->
						<div class="checkbox" style="display: none;">
							<input type="checkbox" id="18Check" name="18" checked>
							<value for="18Check">Hide 18+</value>
						</div>
					</div>
				</div>
			</div>
		</div>
		<script src="javascript.js"></script>
	</body>
</html>
